<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Neural network left side - brain/AI motif -->
  <!-- Main nodes -->
  <circle cx="38" cy="36" r="7" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="58" cy="28" r="5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="30" cy="58" r="6" fill="#00d4ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="52" cy="52" r="8" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="38" cy="76" r="5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="62" cy="70" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="22" cy="82" r="4" fill="#7c3aed" opacity="0.8"/>
  <circle cx="48" cy="90" r="5" fill="#00d4ff" opacity="0.7"/>
  <!-- Center brain node -->
  <circle cx="40" cy="64" r="10" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Edges neural network -->
  <line x1="38" y1="36" x2="58" y2="28" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="38" y1="36" x2="30" y2="58" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="38" y1="36" x2="52" y2="52" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="58" x2="52" y2="52" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="30" y1="58" x2="38" y2="76" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="52" y1="52" x2="38" y2="76" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
  <line x1="52" y1="52" x2="62" y2="70" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="38" y1="76" x2="48" y2="90" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="52" y1="52" x2="40" y2="64" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
  <line x1="38" y1="76" x2="40" y2="64" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="58" x2="22" y2="82" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>

  <!-- Document/paper nodes right side -->
  <rect x="74" y="24" width="18" height="22" rx="3" fill="#fff" opacity="0.9"/>
  <line x1="78" y1="32" x2="88" y2="32" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="78" y1="36" x2="88" y2="36" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="78" y1="40" x2="84" y2="40" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>

  <rect x="78" y="54" width="18" height="22" rx="3" fill="#fff" opacity="0.85"/>
  <line x1="82" y1="62" x2="92" y2="62" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="82" y1="66" x2="92" y2="66" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="82" y1="70" x2="88" y2="70" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>

  <rect x="88" y="84" width="18" height="22" rx="3" fill="#fff" opacity="0.8"/>
  <line x1="92" y1="92" x2="102" y2="92" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="92" y1="96" x2="102" y2="96" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>
  <line x1="92" y1="100" x2="98" y2="100" stroke="#1a1a2e" stroke-width="1.5" opacity="0.4"/>

  <!-- Connection lines: brain to documents -->
  <path d="M50 58 Q62 40 74 28" stroke="url(#accent)" stroke-width="2" fill="none" stroke-dasharray="4 2" opacity="0.8"/>
  <path d="M52 64 Q66 58 78 62" stroke="url(#accent)" stroke-width="2" fill="none" stroke-dasharray="4 2" opacity="0.8"/>
  <path d="M52 72 Q70 78 88 90" stroke="url(#accent)" stroke-width="2" fill="none" stroke-dasharray="4 2" opacity="0.7"/>

  <!-- Small accent dots -->
  <circle cx="64" cy="34" r="2" fill="#00d4ff" opacity="0.6"/>
  <circle cx="70" cy="50" r="1.5" fill="#7c3aed" opacity="0.6"/>
  <circle cx="76" cy="78" r="2" fill="#00d4ff" opacity="0.5"/>
</svg>
