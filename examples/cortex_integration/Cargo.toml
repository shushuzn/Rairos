[package]
name = "cortex_integration"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Cortex crates
cortexai-agents = "0.1"
cortexai-tools = "0.1"
cortexai-providers = "0.1"

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
