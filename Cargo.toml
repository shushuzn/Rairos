[workspace]
resolver = "2"
members = [
    "crates/rairos-core",
    "crates/rairos-cli",
    "crates/rairos-parser",
    "crates/rairos-llm",
    "crates/rairos-research",
    "crates/rairos-web",
    "crates/rairos-kg",
    "crates/rairos-rankers",
    "crates/rairos-notify",
    "crates/rairos-updaters",
    "crates/rairos-notes",
    "crates/rairos-pdf",
    "crates/rairos-viz",
    "crates/rairos-trends",
    "crates/rairos-render",
    "crates/rairos-mcp",
    "crates/rairos-memory",
    "crates/rairos-auth",
    "crates/rairos-i18n",
    "crates/rairos-replication",
    "crates/rairos-credibility",
    "crates/rairos-impact",
]

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 8
