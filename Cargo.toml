[workspace]
resolver = "2"
members = [
    "crates/rairos-core",
    "crates/rairos-cli",
    "crates/rairos-parser",
    "crates/rairos-llm",
    "crates/rairos-research",
    "crates/rairos-web",
    "crates/rairos-kg",
    "crates/rairos-memory",
]

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 8
