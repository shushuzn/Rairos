    "crates/rairos-vector",
    # Neo4j knowledge graph
    "crates/rairos-kg-neo4j",
    # GraphRAG pipeline
    "crates/rairos-graphrag",
    # PDF advanced parsing
    "crates/rairos-pdf-advanced",
    # Multi-agent orchestration
    "crates/rairos-cortex-pro",
    # Material science tools (for SparksMatter integration)
    "crates/rairos-tools",
