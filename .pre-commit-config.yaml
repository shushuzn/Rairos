# Pre-commit hooks for Rairos
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Scan for secrets before commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Detect secrets in code
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        name: Detect Secrets

  # Prevent .env files from being committed
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: forbid-new-submodules
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer

  # Rust formatting
  - repo: https://github.com/dkupreichik/rust-pre-commit
    rev: v0.1.2
    hooks:
      - id: rustfmt
      - id: clippy
        args: ['--', '-D', 'warnings']

  # Ensure .env.example is present when .env exists
  - repo: local
    hooks:
      - id: env-file-check
        name: Check .env files not committed
        entry: bash -c 'if git diff --cached --name-only | grep -E "^\.env$" >/dev/null 2>&1; then echo "❌ .env file staged!"; exit 1; fi'
        language: system
        pass_filenames: false
