[package]
name = "rairos-parallel-research"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
regex = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
rairos-llm = { path = "../rairos-llm" }
rairos-deep-research = { path = "../rairos-deep-research" }
sha2 = "0.11"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
