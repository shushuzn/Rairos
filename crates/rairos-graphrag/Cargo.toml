[package]
name = "rairos-graphrag"
version = "0.1.0"
edition = "2021"
description = "GraphRAG implementation combining vector retrieval with knowledge graph reasoning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rairos/rairos"
rust-version = "1.80"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async traits
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Dependencies on other Rairos crates
rairos-vector = { path = "../rairos-vector" }
rairos-kg-neo4j = { path = "../rairos-kg-neo4j" }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["llm"]
llm = ["rairos-vector/llm"]
