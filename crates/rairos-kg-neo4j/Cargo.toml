[package]
name = "rairos-kg-neo4j"
version = "0.1.0"
edition = "2021"
description = "Neo4j knowledge graph for Rairos with Cypher query support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rairos/rairos"
rust-version = "1.80"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

# HTTP client for Neo4j HTTP API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async traits
async-trait = "0.1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Neo4j transaction management
# Note: Using HTTP API. For Bolt protocol, consider `neo4j` crate bindings.

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["http"]
http = []
