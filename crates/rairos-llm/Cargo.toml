[package]
name = "rairos-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
futures-util.workspace = true
tokio-stream = "0.1"
bytes = "1.0"
tracing.workspace = true
async-trait = "0.1"
anyhow.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
dirs.workspace = true
regex.workspace = true
rusqlite.workspace = true
rand.workspace = true

# Insight crates — direct dependencies on implementation crates
rairos-crossover = { path = "../rairos-crossover" }
rairos-insight-cards = { path = "../rairos-insight-cards" }
rairos-insight-credibility = { path = "../rairos-insight-credibility" }
rairos-insight-evolution = { path = "../rairos-insight-evolution" }
rairos-insight-storage = { path = "../rairos-insight-storage" }
rairos-insight-tracker = { path = "../rairos-insight-tracker" }
rairos-insight-types = { path = "../rairos-insight-types" }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.6"
tempfile.workspace = true
