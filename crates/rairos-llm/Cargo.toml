[package]
name = "rairos-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.0"
tracing = "0.1"
async-trait = "0.1"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
rand = "0.8"

# Orphan rescues — re-exported via llm_orphans module
rairos-chat = { path = "../rairos-chat" }
rairos-client = { path = "../rairos-client" }
rairos-credibility = { path = "../rairos-credibility" }
rairos-credibility-scorer = { path = "../rairos-credibility-scorer" }
rairos-rigor = { path = "../rairos-rigor" }
rairos-scoring-momentum = { path = "../rairos-scoring-momentum" }
rairos-impact = { path = "../rairos-impact" }
rairos-impact-scorer = { path = "../rairos-impact-scorer" }
rairos-gene-pool-decay = { path = "../rairos-gene-pool-decay" }
rairos-pool = { path = "../rairos-pool" }
rairos-game-mode = { path = "../rairos-game-mode" }
rairos-achievements = { path = "../rairos-achievements" }
rairos-climate = { path = "../rairos-climate" }
rairos-eval-gap-monitor = { path = "../rairos-eval-gap-monitor" }
rairos-contradiction = { path = "../rairos-contradiction" }
rairos-cross-referencer = { path = "../rairos-cross-referencer" }
rairos-litreview = { path = "../rairos-litreview" }
rairos-litreview-generator = { path = "../rairos-litreview-generator" }
rairos-briefing-generator = { path = "../rairos-briefing-generator" }
rairos-briefing-distributor = { path = "../rairos-briefing-distributor" }
rairos-distributor = { path = "../rairos-distributor" }
rairos-paradigm = { path = "../rairos-paradigm" }
rairos-replication = { path = "../rairos-replication" }
rairos-query = { path = "../rairos-query" }
rairos-query-types = { path = "../rairos-query-types" }
rairos-rankers = { path = "../rairos-rankers" }
rairos-rankers-cosine = { path = "../rairos-rankers-cosine" }
rairos-rankers-score = { path = "../rairos-rankers-score" }
rairos-trend-analyzer = { path = "../rairos-trend-analyzer" }
rairos-rankers-base = { path = "../rairos-rankers-base" }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.6"
tempfile = "3"
