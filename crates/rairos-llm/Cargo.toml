[package]
name = "rairos-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.0"
tracing = "0.1"
async-trait = "0.1"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
rand = "0.8"
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
tar = "0.4"
rust_decimal = { version = "1.33", features = ["serde"] }
log = "0.4"
ndarray = "0.16"
parking_lot = "0.12"
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.6"
tempfile = "3"
