[package]
name = "rairos-db"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[target.'cfg(not(target_os = "windows"))'.dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "rairos_db_py"
crate-type = ["cdylib"]
