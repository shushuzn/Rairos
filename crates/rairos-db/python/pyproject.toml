[project]
name = "rairos-db"
version = "0.1.0"
description = "PyO3 bindings for rairos-db"
requires-python = ">=3.10"
dependencies = []

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0"]

[tool.maturin]
manifest-path = "../Cargo.toml"
module-name = "rairos_db_py"
rust-founding-bench = false
cargo-args = ["--features", "extension-module"]
