[package]
name = "rairos-kg"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
anyhow = "1.0"
dirs = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
