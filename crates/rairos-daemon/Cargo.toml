[package]
name = "rairos-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
regex = "1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
warp = "0.3"
rairos-llm = { path = "../rairos-llm" }
rairos-events = { path = "../rairos-events" }

[dev-dependencies]
tempfile = "3"
