[package]
name = "rairos-workspace-snapshot"
version = "0.1.0"
edition = "2021"

[lib]
name = "rairos_workspace_snapshot_py"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
pyo3 = { version = "0.24.1", features = ["extension-module"] }

[dev-dependencies]
tempfile = "3"
