[package]
name = "rairos-postprocess"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-llm = { path = "../rairos-llm" }
rairos-kg = { path = "../rairos-kg" }
rairos-render = { path = "../rairos-render" }
rairos-insight-cards = { path = "../rairos-insight-cards" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
thiserror = "1.0"
tracing = "0.1"
