[package]
name = "rairos-postprocess"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-llm = { path = "../rairos-llm" }
rairos-kg = { path = "../rairos-kg" }
rairos-render = { path = "../rairos-render" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt", "macros"] }
thiserror = "1.0"
tracing.workspace = true
