[package]
name = "rairos-mcp-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "rairos_mcp_py"
crate-type = ["cdylib"]

[dependencies]
rairos-mcp = { path = "../rairos-mcp" }
serde_json = "1"
pyo3 = { version = "0.24.1", features = ["extension-module"] }
tokio = { version = "1", features = ["rt", "macros"] }
