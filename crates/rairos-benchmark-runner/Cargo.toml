[package]
name = "rairos-benchmark-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
regex.workspace = true
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rairos-llm = { path = "../rairos-llm" }
rairos-diagnostics = { path = "../rairos-diagnostics" }
uuid = { version = "1.0", features = ["v4"] }
[dev-dependencies]
tempfile.workspace = true
