[package]
name = "rairos-benchmark-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rairos-diagnostics = { path = "../rairos-diagnostics" }
rairos-crossover = { path = "../rairos-crossover" }
rairos-insight-types = { path = "../rairos-insight-types" }

[dev-dependencies]
tempfile = "3"
