thiserror = "2"
chrono = { workspace = true, features = ["serde"] }
rairos-llm = { path = "../rairos-llm" }
rairos-diagnostics = { path = "../rairos-diagnostics" }
uuid = { workspace = true, features = ["v4"] }
[dev-dependencies]
tempfile.workspace = true
