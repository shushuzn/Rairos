[package]
name = "rairos-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-parser = { path = "../rairos-parser" }
rairos-notes = { path = "../rairos-notes" }
rairos-kg = { path = "../rairos-kg" }
rairos-llm = { path = "../rairos-llm" }
rairos-pdf = { path = "../rairos-pdf" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

[dev-dependencies]
tokio-test = "0.4"
