[package]
name = "rairos-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-parser = { path = "../rairos-parser" }
rairos-notes = { path = "../rairos-notes" }
rairos-kg = { path = "../rairos-kg" }
rairos-llm = { path = "../rairos-llm" }
rairos-pdf = { path = "../rairos-pdf" }
rairos-leaderboard = { path = "../rairos-leaderboard" }
rairos-claimgraph = { path = "../rairos-claimgraph" }
rairos-experiment-tracker = { path = "../rairos-experiment-tracker" }
rairos-gene-pool-watcher = { path = "../rairos-gene-pool-watcher" }
rairos-trends = { path = "../rairos-trends" }
rairos-research-memory = { path = "../rairos-research-memory" }
rairos-review-simulator = { path = "../rairos-review-simulator" }
rairos-replication-checker = { path = "../rairos-replication-checker" }
rairos-replication = { path = "../rairos-replication" }
rairos-research = { path = "../rairos-research" }
rairos-rankers = { path = "../rairos-rankers" }
dirs.workspace = true
uuid = { workspace = true, features = ["v4"] }
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "io-std", "sync", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
async-trait = "0.1"
chrono = { workspace = true, features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2.1"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
# Orphan rescues — MCP tool crates
rairos-deep-research = { path = "../rairos-deep-research" }
rairos-orchestrator = { path = "../rairos-orchestrator" }
rairos-parallel-research = { path = "../rairos-parallel-research" }
rairos-topic-discovery = { path = "../rairos-topic-discovery" }

[dev-dependencies]
tokio-test = "0.4"
