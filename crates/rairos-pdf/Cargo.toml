[package]
name = "rairos-pdf"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
sha2 = "0.10"
lazy_static = "1.4"

[dev-dependencies]
tokio-test = "0.4"
