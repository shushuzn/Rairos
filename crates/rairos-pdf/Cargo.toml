[package]
name = "rairos-pdf"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-code-generator = { path = "../rairos-code-generator" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
sha2 = "0.11"
hex = "0.4"
lopdf = "0.34"
lazy_static = "1.4"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
