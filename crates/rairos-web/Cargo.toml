[package]
name = "rairos-web"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-parser = { path = "../rairos-parser" }
rairos-research = { path = "../rairos-research" }
rairos-llm = { path = "../rairos-llm" }
rairos-kg = { path = "../rairos-kg" }
rairos-memory = { path = "../rairos-memory" }
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
once_cell = "1.19"
dirs = "5"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
axum-test = "15"
tokio-test = "0.4"
