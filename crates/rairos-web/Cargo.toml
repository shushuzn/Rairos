[package]
name = "rairos-web"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-parser = { path = "../rairos-parser" }
rairos-research = { path = "../rairos-research" }
rairos-llm = { path = "../rairos-llm" }
rairos-kg = { path = "../rairos-kg" }
rairos-memory = { path = "../rairos-memory" }
axum = "0.8"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
once_cell = "1.19"
dirs.workspace = true
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
axum-test = "20"
tokio-test = "0.4"
