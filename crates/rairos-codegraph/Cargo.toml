[package]
name = "rairos-codegraph"
version = "0.1.0"
edition = "2021"
description = "CodeGraph MCP server for Rairos"
license = "MIT"

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["rt"] }
libsqlite3-sys = { version = "0.28.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-language = "0.1"
walkdir = "2.5"
once_cell = "1.20"
parking_lot = "0.12"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"
