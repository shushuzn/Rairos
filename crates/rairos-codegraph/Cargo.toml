[package]
name = "rairos-codegraph"
version = "0.1.0"
edition = "2021"
description = "CodeGraph MCP server for Rairos"
license = "MIT"

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-language = "0.1"
walkdir = "2.5"
once_cell = "1.20"
parking_lot = "0.12"
thiserror = "2.0"
