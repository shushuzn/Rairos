[package]
name = "rairos-scout"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-xml-rs = "0.6"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
thiserror = "2.0"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
