[package]
name = "rairos-cortex"
version = "0.1.0"
edition = "2021"
description = "Cortex AI agent runtime integration for Rairos - experimental"
publish = false

[workspace]

[dependencies]
# Cortex crates (only cortexai-core to avoid sqlite3 conflict)
cortexai-core = "0.1"

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# Utils
uuid = { version = "1", features = ["v4"] }
