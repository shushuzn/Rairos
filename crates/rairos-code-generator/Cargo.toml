[package]
name = "rairos-code-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rairos-llm = { path = "../rairos-llm" }
rairos-insight-types = { path = "../rairos-insight-types" }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
