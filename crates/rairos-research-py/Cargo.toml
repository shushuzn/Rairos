[package]
name = "rairos-research-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "rairos_research_py"
crate-type = ["cdylib"]

[dependencies]
rairos-research = { path = "../rairos-research" }
rairos-core = { path = "../rairos-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.24.1", features = ["extension-module"] }
