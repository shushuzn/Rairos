[package]
name = "rairos-paper-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-provenance = { path = "../rairos-provenance" }
rairos-code-generator = { path = "../rairos-code-generator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lopdf = "0.34"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
