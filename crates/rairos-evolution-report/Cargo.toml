[package]
name = "rairos-evolution-report"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
regex = "1"
lazy_static = "1.4"
rairos-evolution = { path = "../rairos-evolution" }

[dev-dependencies]
tempfile = "3"