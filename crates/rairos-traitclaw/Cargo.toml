[package]
name = "rairos-traitclaw"
version = "0.1.0"
edition = "2021"
description = "TraitClaw integration for Rairos - experimental AI agent traits"
publish = false

[workspace]

[dependencies]
# TraitClaw core
traitclaw-core = { git = "https://github.com/traitclaw/traitclaw", branch = "main" }
traitclaw-macros = { git = "https://github.com/traitclaw/traitclaw", branch = "main" }

# Async
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
