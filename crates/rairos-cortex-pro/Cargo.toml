[package]
name = "rairos-cortex-pro"
version = "0.1.0"
edition = "2021"
description = "Production multi-agent collaboration with LangGraph-style orchestration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rairos/rairos"
rust-version = "1.80"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async traits
async-trait = "0.1"

# Futures for Stream
futures = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Performance optimizations
smallvec = { version = "1", features = ["serde"] }           # Stack-allocated small vectors
lru = "0.16"            # LRU cache for regex and keyword caching
parking_lot.workspace = true  # Fast synchronization primitives

# Existing Rairos crates
rairos-llm = { path = "../rairos-llm", optional = true }
rairos-pdf = { path = "../rairos-pdf" }
rairos-vector = { path = "../rairos-vector" }
rairos-kg-neo4j = { path = "../rairos-kg-neo4j" }

# Material science tools (for SparksMatter integration)
rairos-tools = { path = "../rairos-tools", optional = true }

# Regex for intent classification (used in tools feature)
regex = { version = "1", optional = true }

# HTTP API (optional)
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
futures = "0.3"

[[bench]]
name = "agent_bench"
harness = false

[[bench]]
name = "crew_bench"
harness = false

[[bench]]
name = "tool_bench"
harness = false

[features]
default = ["llm"]
llm = ["dep:rairos-llm", "rairos-vector/llm"]
tools = ["dep:rairos-tools", "dep:regex"]
api = ["axum", "tokio/net", "clap"]
