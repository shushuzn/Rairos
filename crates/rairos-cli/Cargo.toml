rairos-cli-shared = { path = "../rairos-cli-shared" }
rairos-simple-cli = { path = "../rairos-simple-cli" }
# Dependencies for inlined CLI-only crates
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
sysinfo = "0.34"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
regex = "1.10"
csv = "1.3"
dirs = "5.0"
indicatif = "0.17"
console = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
ratatui = "0.28"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
