[package]
name = "rairos-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-pdf = { path = "../rairos-pdf" }
rairos-llm = { path = "../rairos-llm" }
rairos-web = { path = "../rairos-web" }
rairos-kg = { path = "../rairos-kg" }
rairos-memory = { path = "../rairos-memory" }
rairos-argument-builder = { path = "../rairos-argument-builder" }
rairos-citation-chain = { path = "../rairos-citation-chain" }
rairos-research = { path = "../rairos-research" }
rairos-dashboard = { path = "../rairos-dashboard" }
rairos-weekly-digest = { path = "../rairos-weekly-digest" }
rairos-discover = { path = "../rairos-discover" }
rairos-evolution = { path = "../rairos-evolution" }
rairos-experiment-tracker = { path = "../rairos-experiment-tracker" }
rairos-friction = { path = "../rairos-friction" }
rairos-insight-cards = { path = "../rairos-insight-cards" }
rairos-intelligence = { path = "../rairos-intelligence" }
rairos-journal = { path = "../rairos-journal" }
rairos-litreview-analyzer = { path = "../rairos-litreview-analyzer" }
rairos-generate = { path = "../rairos-generate" }
rairos-replication-checker = { path = "../rairos-replication-checker" }
rairos-evolution-report = { path = "../rairos-evolution-report" }
rairos-research-log = { path = "../rairos-research-log" }
rairos-review-generator = { path = "../rairos-review-generator" }
rairos-scout = { path = "../rairos-scout" }
rairos-research-session = { path = "../rairos-research-session" }
rairos-signal = { path = "../rairos-signal" }
rairos-story = { path = "../rairos-story" }
rairos-viz = { path = "../rairos-viz" }
rairos-gene-pool-watcher = { path = "../rairos-gene-pool-watcher" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
regex = "1.10"
csv = "1.3"
dirs = "5.0"
indicatif = "0.17"
console = "0.15"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
