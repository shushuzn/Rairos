[package]
name = "rairos-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
csv = "1.3"
indicatif = "0.17"
console = "0.15"
tokio = { version = "1", features = ["full"] }
