[package]
name = "rairos-claimgraph"
version = "0.1.0"
edition = "2021"

[lib]
name = "rairos_claimgraph_py"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.24.1", features = ["extension-module"] }
