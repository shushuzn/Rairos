[package]
name = "rairos-insight-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
parking_lot.workspace = true
rairos-insight-credibility = { path = "../rairos-insight-credibility" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
chrono.workspace = true
dirs.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
