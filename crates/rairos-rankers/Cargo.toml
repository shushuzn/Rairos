[package]
name = "rairos-rankers"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
ndarray = "0.16"
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.11", features = ["v4"] }
