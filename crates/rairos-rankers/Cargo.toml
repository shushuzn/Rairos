[package]
name = "rairos-rankers"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
ndarray = "0.16"
rusqlite.workspace = true
thiserror = "2.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { workspace = true, features = ["serde"] }
parking_lot = "0.12"
uuid = { workspace = true, features = ["v4"] }
