[package]
name = "rairos-pdf-advanced"
version = "0.1.0"
edition = "2021"
description = "Advanced PDF parsing with GROBID, NER, and triple extraction"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rairos/rairos"
rust-version = "1.80"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

# HTTP client for GROBID API
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Regex for pattern matching
regex = "1"

# Base64 encoding
base64 = "0.22"

# Existing Rairos crates
rairos-pdf = { path = "../rairos-pdf" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[features]
default = ["grobid"]
grobid = []
ner = []
