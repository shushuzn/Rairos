[package]
name = "rairos-db-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "rairos_db_py"
crate-type = ["cdylib"]

[dependencies]
rairos-db = { path = "../rairos-db" }
rusqlite = { version = "0.32", features = ["bundled"] }
pyo3 = { version = "0.24", features = ["extension-module"] }
serde_json = "1"
