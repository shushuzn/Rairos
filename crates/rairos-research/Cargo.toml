[package]
name = "rairos-research"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-parser = { path = "../rairos-parser" }
rairos-pdf = { path = "../rairos-pdf" }
rairos-llm = { path = "../rairos-llm" }
rairos-kg = { path = "../rairos-kg" }
rairos-trends = { path = "../rairos-trends" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
anyhow.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
dirs.workspace = true
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }

[dev-dependencies]
tokio-test = "0.4"
