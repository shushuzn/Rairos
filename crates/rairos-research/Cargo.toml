[package]
name = "rairos-research"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-parser = { path = "../rairos-parser" }
rairos-llm = { path = "../rairos-llm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
