[package]
name = "rairos-core"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
tempfile.workspace = true

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
regex.workspace = true
dirs.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# Orphan rescues — re-exported through rairos_core:: module tree
rairos-retry = { path = "../rairos-retry" }
rairos-cache = { path = "../rairos-cache" }
rairos-core-utils = { path = "../rairos-core-utils" }
rairos-exceptions = { path = "../rairos-exceptions" }
rairos-config = { path = "../rairos-config" }
rairos-perf = { path = "../rairos-perf" }
rairos-rate-limiter = { path = "../rairos-rate-limiter" }
rairos-observability = { path = "../rairos-observability" }
rairos-user-helpers = { path = "../rairos-user-helpers" }
rairos-auth = { path = "../rairos-auth" }
rairos-notifications = { path = "../rairos-notifications" }
rairos-notify = { path = "../rairos-notify" }
rairos-db-migrate = { path = "../rairos-db-migrate" }

