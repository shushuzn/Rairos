[package]
name = "rairos-core"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
tempfile = "3"

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
lazy_static = "1.4"
regex = "1.0"

# Orphan rescues — re-exported through rairos_core:: module tree
rairos-retry = { path = "../rairos-retry" }
rairos-cache = { path = "../rairos-cache" }
rairos-core-utils = { path = "../rairos-core-utils" }
rairos-exceptions = { path = "../rairos-exceptions" }
rairos-config = { path = "../rairos-config" }
rairos-perf = { path = "../rairos-perf" }
rairos-rate-limiter = { path = "../rairos-rate-limiter" }
rairos-text = { path = "../rairos-text" }
rairos-observability = { path = "../rairos-observability" }
rairos-user-helpers = { path = "../rairos-user-helpers" }
rairos-auth = { path = "../rairos-auth" }
rairos-notifications = { path = "../rairos-notifications" }
rairos-notify = { path = "../rairos-notify" }
rairos-db-migrate = { path = "../rairos-db-migrate" }

