[package]
name = "rairos-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-llm = { path = "../rairos-llm" }
rairos-parser = { path = "../rairos-parser" }
rairos-rankers = { path = "../rairos-rankers" }
rairos-observability = { path = "../rairos-observability" }
rairos-cortex-pro = { path = "../rairos-cortex-pro", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
async-trait = "0.1"
tracing.workspace = true
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
regex.workspace = true
dirs.workspace = true
futures.workspace = true
rustc-hash.workspace = true

[features]
default = ["cortex-integration"]
cortex-integration = ["dep:rairos-cortex-pro"]

[dev-dependencies]
tempfile.workspace = true
