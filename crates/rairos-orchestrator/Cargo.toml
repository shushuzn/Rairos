[package]
name = "rairos-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
rairos-core = { path = "../rairos-core" }
rairos-llm = { path = "../rairos-llm" }
rairos-insight-tracker = { path = "../rairos-insight-tracker" }
rairos-insight-evolution = { path = "../rairos-insight-evolution" }
rairos-insight-types = { path = "../rairos-insight-types" }
rairos-insight-credibility = { path = "../rairos-insight-credibility" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
