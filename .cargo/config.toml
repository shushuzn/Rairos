[build]
jobs = 2
incremental = true
rustc-wrapper = "sccache"

[net]
retry = 3
git-fetch-with-cli = true

[http]
timeout = 60

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "llvm-args=--enable-merge-functions",
    "-C", "llvm-args=--enable-load-pre",
]

# Dev: fast compilation with parallel codegen units
[profile.dev]
opt-level = 0
debug = false
panic = "unwind"
codegen-units = 256
incremental = true
embed-bitcode = false

# Dependencies in dev: moderate optimization without debug
[profile.dev.package."*"]
opt-level = 2
debug = false
codegen-units = 256

# Release: maximize runtime performance
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
