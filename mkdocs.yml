site_name: AI Research OS

site_description: A Self-Evolving Research Operating System for AI Researchers

site_url: https://shushuzn.github.io/Rairos/

base_url: /Rairos/

site_author: shushuzn



repo_name: shushuzn/Rairos

repo_url: https://github.com/shushuzn/Rairos

copyright: Copyright &copy; 2026 shushuzn



theme:

  name: material

  logo: assets/logo.svg

  favicon: assets/favicon.svg

  palette:

    - scheme: default

      primary: indigo

      accent: indigo

      toggle:

        icon: material/brightness-7

        name: Switch to dark mode

    - scheme: slate

      primary: indigo

      accent: indigo

      toggle:

        icon: material/brightness-4

        name: Switch to light mode

  features:

    - navigation.instant

    - navigation.tracking

    - navigation.tabs

    - navigation.sections  # Expand sections in sidebar

    - content.code.copy

    - content.action.view  # Edit page links

    - content.action.edit  # Edit page links



extra:

  social:

    - icon: fontawesome/brands/github

      link: https://github.com/shushuzn

    - icon: fontawesome/brands/python

      link: https://pypi.org/project/ai-research-os/

  generator: false  # Remove "Created with Material for MkDocs"



extra_css:

  - stylesheets/extra.css



nav:

  - Home: index.md

  - Installation: installation.md

  - Usage: usage.md

  - CLI Reference: cli.md

  - Architecture: architecture.md

  - Configuration: configuration.md
  - Benchmarks: benchmarks.md
  - Specifications:
      - Phase 1 — Infrastructure: specs/phase1-spec.md

      - Phase 2 — Search & Import: specs/phase2-spec.md

      - Phase 3 — Citation Graph: specs/phase3-citation-graph-spec.md

  - Community:

      - Contributing: contributing.md

      - Roadmap: roadmap.md

      - Changelog: https://github.com/shushuzn/Rairos/blob/main/CHANGELOG.md

      - GitHub: https://github.com/shushuzn/Rairos



markdown_extensions:

  - pymdownx.highlight:

      anchor_linenums: true

  - pymdownx.superfences

  - pymdownx.snippets

  - admonition

  - pymdownx.details

  - tables

  - attr_list

  - md_in_html

  - pymdownx.tasklist:

      custom_checkbox: true

  - toc:

      permalink: true



plugins:

  - search:

      separator: '[\s\-,:!=\[\]()"/\\]+'

      
  - git-revision-date-localized:

      type: timeago

  - minify:

      minify_html: true



