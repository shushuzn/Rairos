[package]
name = "rairos-benches"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rairos-identifiers = { path = "../crates/rairos-identifiers" }
rairos-text-utils = { path = "../crates/rairos-text-utils" }
rairos-batch-optimizer = { path = "../crates/rairos-batch-optimizer" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "identifiers"
harness = false
path = "identifiers.rs"

[[bench]]
name = "text_utils"
harness = false
path = "text_utils.rs"

[[bench]]
name = "batch_optimizer"
harness = false
path = "batch_optimizer.rs"
