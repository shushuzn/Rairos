[package]
name = "rairos-benches"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rairos-core = { path = "../crates/rairos-core" }
rairos-text = { path = "../crates/rairos-text" }
rairos-batch-optimizer = { path = "../crates/rairos-batch-optimizer" }
rairos-research = { path = "../crates/rairos-research" }
rairos-mcp = { path = "../crates/rairos-mcp" }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "identifiers"
harness = false
path = "identifiers.rs"

[[bench]]
name = "text_utils"
harness = false
path = "text_utils.rs"

[[bench]]
name = "batch_optimizer"
harness = false
path = "batch_optimizer.rs"

[[bench]]
name = "research_core"
harness = false
path = "research_core.rs"
