[build-system]

requires = ["setuptools>=82.0.1", "wheel"]

build-backend = "setuptools.build_meta"

[project]

name = "ai-research-os"

version = "1.7.1"

description = "Rairos — Self-Evolving Research OS for AI Researchers — manage papers, detect research gaps, generate insights"

readme = "README.md"

requires-python = ">=3.10"

authors = [

    {name = "shushuzn", email = "shushuzn@example.com"}

]

keywords = ["research", "ai", "papers", "arxiv", "notes", "zettelkasten"]

classifiers = [

    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.10",

    "Programming Language :: Python :: 3.11",

    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

]

dependencies = [
    # rairos_mcp.py uses only stdlib (json, typing)
    # All tool implementations are Rust-native via rairos_mcp_py (PyO3)
]

[project.optional-dependencies]

dev = ["pytest>=9.0.3", "pytest-timeout>=2.4.0"]

[project.scripts]

[project.urls]

Homepage = "https://github.com/shushuzn/rairos"

Repository = "https://github.com/shushuzn/rairos"

Documentation = "https://github.com/shushuzn/rairos#readme"

[project.license]

text = "GPL-3.0-or-later"

[tool.setuptools.packages.find]

where = ["."]

include = ["mcp"]

[tool.setuptools]

py-modules = []

[tool.setuptools.package-data]

completions = ["bash", "zsh", "fish"]
"*" = ["py.typed"]

[tool.commitizen]

name = "cz_v1"

tag_format = "$version"

version_files = ["pyproject.toml"]

[tool.ruff]

target-version = "py310"

line-length = 100

indent-width = 4

[tool.ruff.lint]

select = ["E4", "E7", "F", "W", "B", "I"]

ignore = ["E402", "E501", "E741", "B008", "B017", "I001", "B023", "F821", "F401"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

[tool.mypy]

python_version = "3.12"

warn_return_any = true

warn_unused_configs = true

ignore_missing_imports = true

strict = false

no_implicit_optional = false
exclude = [".venv/", "shared/"]
# mypy 1.20.1 CRLF line-number reporting bug on Windows — known false positives
disable_error_code = ["assignment", "union-attr", "arg-type"]

[tool.coverage.run]

source = ["."]

branch = true

omit = [

    "*/tests/*",

    "*/test_*.py",

    "*/__pycache__/*",

    "*/.venv/*",

    "*/venv/*",

    "*/site-packages/*",

]

[tool.coverage.report]

show_missing = true

skip_covered = false

exclude_lines = [

    "pragma: no cover",

    "pragma: python3 only",

    "if TYPE_CHECKING:",

    "raise NotImplementedError",

    "if __name__ == .__main__.:",

    "@abstractmethod",

]

[tool.pytest.ini_options]
timeout = 60
addopts = "--ignore=tests/test_deep_research.py"
markers = [
    "lean: Lean 4 integration tests (run only when Lean is installed)",
    "no_freeze: Tests that must not use freezegun time mocking",
]

[tool.coverage.html]

directory = "coverage_html"

