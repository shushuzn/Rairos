services:
  # ── Core Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"   # FastAPI hand-drawn web UI
      - "11434:11434" # Ollama API (for semantic search)
    environment:
      AI_RESEARCH_OS_DB: /data/papers.db
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - airos_data:/data
      - airos_home:/home/airos/.ai_research_os
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: ["uvicorn", "web.app_new:app", "--host", "0.0.0.0", "--port", "8501"]

  # ── Ollama — local embeddings & LLM ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 20s
      timeout: 5s
      retries: 3

