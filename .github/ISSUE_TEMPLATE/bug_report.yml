name: Bug Report
description: Report something that is broken or not working as expected
labels: [bug]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please help us understand the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong
      placeholder: |
        Steps to reproduce:
        1. Run `cargo run -p rairos-cli -- import 2601.00155`
        2. Run `cargo run -p rairos-cli -- search "attention"`
        3. See error...

        Expected behavior: ...
        Actual behavior: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS, Rust version, and relevant environment variables
      placeholder: |
        OS: Linux x86_64
        Rust: 1.86.0
        cargo: 1.86.0

        RAIROS_DB=/custom/path/rairos.db
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full Traceback
      description: The complete error message, if applicable
      placeholder: |
        error[E0308]: mismatched types
          --> crates/rairos-core/src/lib.rs:123:45
           |
        123 |     let x: i32 = "hello";
           |              ^^^ expected i32, found &str

        Exit code: 1
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (screenshots, related issues, workarounds)
      placeholder: |
        I tried ... but ...
    validations:
      required: false
