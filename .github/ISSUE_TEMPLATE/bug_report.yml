name: Bug Report
description: Report something that is broken or not working as expected
labels: [bug]
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please help us understand the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong
      placeholder: |
        Steps to reproduce:
        1. Run `python -m cli import 2601.00155`
        2. Run `python -m cli search "attention"`
        3. See error...

        Expected behavior: ...
        Actual behavior: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS, Python version, and relevant environment variables
      placeholder: |
        OS: Windows 11
        Python: 3.12.3
        pip list: requests 2.31.0, feedparser 6.0.10, ...

        AIROS_EMBEDDING_DIM=768
        OPENAI_API_KEY=set
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full Traceback
      description: The complete error message, if applicable
      placeholder: |
        Traceback (most recent call last):
          File "..." line ...
          ...

        Exit code: 1
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (screenshots, related issues, workarounds)
      placeholder: |
        I tried ... but ...
    validations:
      required: false
