name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for making AI Research OS better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who needs it?
      placeholder: |
        As a [type of user], I want [goal] so that [benefit].
        Example: As a PhD student, I want to automatically summarize papers so that I can read 3x more papers per week.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: |
        1. Run `./rairos.sh summarize --paper 2601.00155`
        2. System generates 3-paragraph summary + key findings table
        3. Summary is saved alongside P-Note and can be exported to Notion
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other solutions you've considered or existing tools that do this
      placeholder: |
        - Semantic Scholar has paper summaries but they're generic
        - Notion AI can summarize but lacks research-specific structure
        - I currently use ... but it has these limitations
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, examples, or references to similar features in other tools
      placeholder: |
        See attached screenshot...
        Reference: https://arxiv.org/example
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have (I'd use it if it existed)
        - Important (would significantly improve my workflow)
        - Critical (blocking my research)
    validations:
      required: false
