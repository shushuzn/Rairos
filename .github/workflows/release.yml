name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.5.3)'
        required: true
        type: string

jobs:
  create-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload-cli:
    needs: create-github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get install -y mold clang upx

      - name: Build with PGO
        run: |
          RUSTFLAGS="-Cprofile-generate=/tmp/pgo" cargo build --release -p rairos-cli
          # Collect profiles from build-time execution
          llvm-profdata merge -o /tmp/pgo/merged.profdata /tmp/pgo/*.profraw 2>/dev/null || true
          RUSTFLAGS="-Cprofile-use=/tmp/pgo/merged.profdata" cargo build --release -p rairos-cli

      - name: Build musl static binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl -p rairos-cli

      - name: Compress with UPX
        run: |
          upx --best --lzma target/release/rairos-cli -o rairos-cli-linux-gnu
          upx --best --lzma target/x86_64-unknown-linux-musl/release/rairos-cli -o rairos-cli-linux-musl

      - name: Upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            rairos-cli-linux-gnu
            rairos-cli-linux-musl

  publish-python-sdk:
    needs: create-github-release
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME:1}" >> $GITHUB_OUTPUT
        id: version

      - name: Trigger Python SDK Publish
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: |
          cd sdks/python
          uv build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd sdks/python
          pip install twine
          twine upload dist/*

  publish-js-sdk:
    needs: create-github-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JS SDK Publish
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd sdks/js
          npm ci

      - name: Build package
        run: |
          cd sdks/js
          npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdks/js
          npm publish --access public
