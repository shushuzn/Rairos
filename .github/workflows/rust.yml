name: Rust Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

env:
  CARGO_BUILD_JOBS: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Cache sccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-${{ matrix.rust }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-sccache-

      - name: Install sccache (unix)
        if: runner.os != 'Windows'
        run: |
          SCCACHE_VERSION="v0.11.0"
          curl -sL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          cp "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          mkdir -p ~/.cargo
          echo '[build]' > ~/.cargo/config.toml
          echo 'rustc-wrapper = "sccache"' >> ~/.cargo/config.toml
          echo '[cache]' >> ~/.cargo/config.toml
          echo 'size = "10G"' >> ~/.cargo/config.toml

      - name: Start sccache
        if: runner.os != 'Windows'
        run: sccache --start-server

      - name: cargo build (workspace, deny warnings)
        run: cargo build --workspace

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: Clippy lint
        run: cargo clippy --tests --workspace ${{ runner.os == 'macOS' && '--exclude rairos-sysinfo --exclude rairos-lsp-diagnostics --exclude rairos-workspace-snapshot' || '' }} -- -D warnings

      - name: Show sccache stats
        if: runner.os != 'Windows'
        run: sccache --show-stats
