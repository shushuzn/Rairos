name: Rust Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/rust.yml'

env:
  CARGO_BUILD_JOBS: 1

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Set up Python 3.13 (for PyO3 compatibility)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set PYO3_PYTHON
        run: |
          echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Cache sccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-${{ matrix.rust }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-sccache-

      - name: Install sccache (unix)
        if: runner.os != 'Windows'
        run: |
          SCCACHE_VERSION="v0.11.0"
          curl -sL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          cp "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          mkdir -p ~/.cargo
          echo '[build]' > ~/.cargo/config.toml
          echo 'rustc-wrapper = "sccache"' >> ~/.cargo/config.toml
          echo '[cache]' >> ~/.cargo/config.toml
          echo 'size = "10G"' >> ~/.cargo/config.toml

      - name: Start sccache
        if: runner.os != 'Windows'
        run: sccache --start-server

      - name: cargo check (workspace, deny warnings)
        run: cargo check --workspace

      - name: cargo test (key crates)
        run: |
          cargo test -p rairos-cli -p rairos-pathfinder -p rairos-slides -p rairos-narratives

      - name: Clippy lint
        run: cargo clippy --tests --workspace ${{ runner.os == 'macOS' && '--exclude rairos-db-py --exclude rairos-sysinfo --exclude rairos-research-py --exclude rairos-claimgraph --exclude rairos-survey-generator --exclude rairos-lsp-diagnostics --exclude rairos-workspace-snapshot' || '' }} -- -D warnings

      - name: Verify PyO3 cdylib builds + Python import
        if: runner.os == 'ubuntu-latest'
        run: |
          cargo build --release -p rairos-research-py -p rairos-mcp-py \
            -p rairos-claimgraph -p rairos-survey-generator \
            -p rairos-lsp-diagnostics -p rairos-workspace-snapshot

          # Copy .so files to project root for Python import
          for so in target/release/librairos_*.py.so; do
            cp "$so" "$(basename "$so" | sed 's/^lib//')"
          done
          cp target/release/librairos_sysinfo.so . 2>/dev/null || true
          cp target/release/librairos_db_py.so . 2>/dev/null || true

          # Verify Python can import the Rust modules
          python3 -c "import rairos_research_py; import rairos_mcp_py; tools = rairos_mcp_py.list_tools_rs(); assert len(tools) >= 10; print(f'PyO3 OK: {len(tools)} Rust MCP tools')"

      - name: Install test dependencies
        if: runner.os == 'ubuntu-latest'
        run: |
          python3 -m pip install pytest pytest-timeout pytest-asyncio --quiet

      - name: Run Python MCP tests
        if: runner.os == 'ubuntu-latest'
        run: |
          python3 -m pytest tests/test_mcp_handler.py \
            tests/test_mcp_schema_fuzz.py \
            tests/test_mcp_tools.py \
            tests/test_rairos_mcp_utils.py \
            -q --tb=short --timeout=30 2>&1 | tail -15

      - name: Show sccache stats
        if: runner.os != 'Windows'
        run: sccache --show-stats
