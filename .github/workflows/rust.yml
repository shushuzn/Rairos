name: Rust Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  SCCACHE_IDLE_TIMEOUT: 0
  AWS_LC_SYS_NOASM: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo clippy
        run: cargo clippy --tests --workspace -- -D warnings

      - name: Check for deprecated items usage
        run: |
          if cargo doc --workspace --no-deps 2>&1 | grep -q "deprecated"; then
            echo "⚠️  Workspace contains deprecated items"
          else
            echo "✅ No deprecated items used"
          fi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: rairos-${{ matrix.rust }}

      - name: Install sccache (pre-built binary)
        if: runner.os != 'Windows'
        run: |
          curl -sL "https://github.com/mozilla/sccache/releases/download/v0.15.0/sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          cp /tmp/sccache-v0.15.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          if command -v mold 2>/dev/null; then
            echo "mold already installed"
          elif command -v apt-get 2>/dev/null; then
            sudo apt-get install -y mold clang
          fi
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: Start sccache
        if: runner.os != 'Windows'
        run: sccache --start-server

      - name: Cache sccache artifacts
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.rust }}-
            sccache-${{ runner.os }}-

      - name: Build (release)
        run: cargo build --release -p rairos-cli

      - name: Test
        run: cargo test -p rairos-cli

      - name: Security audit
        if: matrix.rust == 'stable' && runner.os == 'ubuntu-latest'
        run: cargo audit

      - name: License check
        if: matrix.rust == 'stable' && runner.os == 'ubuntu-latest'
        run: cargo deny check licenses

      - name: Show cache stats
        if: runner.os != 'Windows'
        run: |
          echo "=== sccache ==="
          sccache --show-stats
          echo "=== cargo cache ==="
          du -sh ~/.cargo/registry/cache/ 2>/dev/null || echo "no cache"
