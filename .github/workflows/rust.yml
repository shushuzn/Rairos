name: Rust Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 10G
  AWS_LC_SYS_NOASM: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo clippy
        run: cargo clippy --tests --workspace -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Install sccache + mold (unix)
        if: runner.os != 'Windows'
        run: |
          if command -v mold 2>/dev/null; then
            echo "mold already installed"
          elif command -v apt-get 2>/dev/null; then
            sudo apt-get install -y mold clang
          fi
          cargo install sccache --locked
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: Start sccache
        if: runner.os != 'Windows'
        run: sccache --start-server

      - name: Cache sccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-${{ matrix.rust }}-sccache-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (binary only)
        run: cargo build --release -p rairos-cli

      - name: Test (binary only)
        run: cargo test -p rairos-cli

      - name: Security audit
        if: matrix.rust == 'stable' && runner.os == 'ubuntu-latest'
        run: cargo audit

      - name: Show sccache stats
        if: runner.os != 'Windows'
        run: sccache --show-stats
