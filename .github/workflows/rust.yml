name: Rust Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'Cargo.toml'
      - '.github/workflows/rust.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Set up Python 3.13 (for PyO3 compatibility)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set PYO3_PYTHON
        run: |
          echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Cache sccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: ${{ runner.os }}-${{ matrix.rust }}-sccache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-sccache-

      - name: Install sccache (unix)
        if: runner.os != 'Windows'
        run: |
          SCCACHE_VERSION="v0.11.0"
          curl -sL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          cp "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          chmod +x /usr/local/bin/sccache
          mkdir -p ~/.cargo
          echo '[build]' > ~/.cargo/config.toml
          echo 'rustc-wrapper = "sccache"' >> ~/.cargo/config.toml
          echo '[cache]' >> ~/.cargo/config.toml
          echo 'size = "10G"' >> ~/.cargo/config.toml

      - name: Start sccache
        if: runner.os != 'Windows'
        run: sccache --start-server

      - name: Build and run tests
        run: cargo test --workspace ${{ runner.os == 'macOS' && '--exclude rairos-db-py --exclude rairos-sysinfo' || '' }}

      - name: Clippy lint
        run: cargo clippy --tests --workspace ${{ runner.os == 'macOS' && '--exclude rairos-db-py --exclude rairos-sysinfo' || '' }} -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --config audit.toml

      - name: Show sccache stats
        if: runner.os != 'Windows'
        run: sccache --show-stats

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python 3.13 (for PyO3 compatibility)
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set PYO3_PYTHON
        run: |
          echo "PYO3_PYTHON=$(which python3)" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-cargo-

      - name: Build benchmarks
        run: cargo bench --no-run --workspace

      - name: Run benchmarks
        run: cargo bench --workspace 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark_output.txt
          retention-days: 7
