name: Rust Build

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check all crates
        run: |
          cargo check --package rairos-core
          cargo check --package rairos-cli
          cargo check --package rairos-parser
          cargo check --package rairos-llm
        working-directory: .

      - name: Build all crates
        run: cargo build --workspace
        working-directory: .

      - name: Run core tests
        run: cargo test --package rairos-core -- --nocapture
        working-directory: .

      - name: Run parser tests
        run: cargo test --package rairos-parser -- --nocapture
        working-directory: .

      - name: Run llm tests
        run: cargo test --package rairos-llm -- --nocapture
        working-directory: .
