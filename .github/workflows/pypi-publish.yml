name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        default: '1.7.1'
    secrets:
      PYPI_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python -m build

      - name: Upload to PyPI
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "PYPI_PASSWORD length: ${#PYPI_PASSWORD}"
          python -m twine upload dist/* \
            --repository-url https://upload.pypi.org/legacy/ \
            --username __token__ \
            --password "$PYPI_PASSWORD" \
            --verbose
