name: Secret Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline . || true

      - name: Check for new secrets
        run: |
          if git diff --cached --name-only | xargs -I{} detect-secrets audit {} 2>/dev/null | grep -q "Secrets found"; then
            echo "❌ New secrets detected in staged files"
            exit 1
          fi
          echo "✅ No new secrets detected"

  env-file-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check .env files are not committed
        run: |
          if git diff --cached --name-only | grep -E "^\.env$" >/dev/null 2>&1; then
            echo "❌ .env file staged for commit!"
            echo "Remove .env from staging: git reset HEAD .env"
            exit 1
          fi
          if git diff --cached --name-only | grep -E "^\.env\." >/dev/null 2>&1; then
            echo "❌ .env.* file staged for commit!"
            echo "These files may contain secrets. Use .env.example template only."
            exit 1
          fi
          echo "✅ No .env files staged"
