name: Changelog

on:
  push:
    branches: [main]

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --prepend CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check diff
        id: diff
        run: |
          git diff --stat CHANGELOG.md
          if [ -z "$(git diff --name-only CHANGELOG.md)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changelog changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          BRANCH="chore/update-changelog-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git add CHANGELOG.md
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "docs: update CHANGELOG.md" || echo "Nothing to commit"
          git push -u origin "$BRANCH" --force || echo "Push failed"

          set +e
          gh pr create \
            --title "docs: update CHANGELOG.md" \
            --body "Auto-generated changelog update" \
            --base main \
            --head "$BRANCH" \
            --label documentation || echo "PR creation failed or already exists"
