name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install -g @commitlint/cli@19 @commitlint/config-conventional@19

      - name: Validate commit messages
        run: |
          npx commitlint --last --verbose 2>&1 || echo "No previous commit"
          npx commitlint --from=main --verbose 2>&1 | head -50

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Syntax check
        run: uv run python -m py_compile ai_research_os.py

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check . --exclude db/

      - name: Run mypy
        run: uvx mypy core parsers db llm research_loop cli --ignore-missing-imports

      - name: Run bandit
        continue-on-error: true
        run: uvx bandit -r llm/ research_loop/ core/ parsers/ db/ -ll -f txt

      - name: Test Crossref API
        run: uv run python -c "import requests; r=requests.get('https://api.crossref.org/works/10.1038/nature12373',timeout=15,headers={'User-Agent':'AI-Research-OS/1.0'}); r.raise_for_status(); print('Crossref OK')"
  test-pytest:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run pytest shard ${{ matrix.shard }}/4
        run: uv run pytest tests/ \
            -q --tb=short -n auto \
            --cov=. --cov-report=term-missing \
            --splits 4 --group ${{ matrix.shard }} \
            2>&1 | tee pytest_output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output-${{ matrix.python-version }}-${{ matrix.shard }}
          path: pytest_output.txt
          retention-days: 1

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.shard }}
          path: .coverage
          retention-days: 1

  coverage-report:
    needs: [test-pytest]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          path: coverage-reports
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and report
        id: report
        run: |
          uv run coverage combine coverage-reports/
          uv run coverage report --show-missing 2>&1 | tee coverage_report.txt
          TOTAL=$(grep "^TOTAL" coverage_report.txt | awk '{print $6}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"
          echo "coverage_pct=${TOTAL}" >> $GITHUB_OUTPUT
          if [ -z "${TOTAL}" ] || [ "${TOTAL}" -lt 40 ]; then
            echo "Coverage ${TOTAL}% below 40% threshold"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-reports/.coverage
          fail_ci_if_error: true

    outputs:
      coverage_pct: ${{ steps.report.outputs.coverage_pct }}
