name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  RUSTFLAGS: "--deny warnings"

jobs:
  rust:
    name: Rust — check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: v1-${{ hashFiles('Cargo.lock') }}

      - name: cargo check (workspace)
        run: cargo check --workspace

      - name: cargo test (key crates)
        run: |
          cargo test -p rairos-cli -p rairos-pathfinder -p rairos-slides -p rairos-narratives

  python:
    name: Python — MCP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: pytest (MCP handler)
        run: uv run pytest tests/test_mcp_handler.py -q --no-header

      - name: pytest (MCP schema + utils)
        run: uv run pytest tests/test_mcp_schema_fuzz.py tests/test_mcp_tools.py tests/test_rairos_mcp_utils.py -q --no-header
