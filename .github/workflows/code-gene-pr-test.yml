name: Code Gene PR Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Set permissions for status checks and notifications
permissions:
  statuses: write
  contents: read
  pull-requests: write

jobs:
  code-gene-test:
    runs-on: ubuntu-latest
    if: |
      startsWith(github.head_ref, 'plan/code-gene/') ||
      startsWith(github.head_ref, 'impl/code-gene/')
    outputs:
      build_status: ${{ steps.build.outputs.status }}
      test_status: ${{ steps.test.outputs.status }}
      test_result: ${{ steps.test.outputs.test_result }}
      target_crate: ${{ steps.crate.outputs.target_crate }}
      pr_number: ${{ steps.crate.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Get target crate
        id: crate
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "PR Title: $PR_TITLE"
          echo "PR Number: $PR_NUM"

          # Extract crate from PR title like "[Plan] Performance - rairos-rankers-base"
          CRATE=$(echo "$PR_TITLE" | grep -oE 'rairos-[a-z-]+' | head -1)
          if [ -z "$CRATE" ]; then
            CRATE="rairos-cli"
          fi
          echo "target_crate=$CRATE" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUM" >> $GITHUB_OUTPUT
          echo "📦 Testing crate: $CRATE"

      # Build step with status output
      - name: Build target crate
        id: build
        run: |
          echo "status=building" >> $GITHUB_OUTPUT
          if cargo build -p ${{ steps.crate.outputs.target_crate }} 2>&1; then
            echo "status=build_success" >> $GITHUB_OUTPUT
            echo "Build ✅"
          else
            echo "status=build_failed" >> $GITHUB_OUTPUT
            echo "Build ❌"
            exit 1
          fi

      # Test step with status output
      - name: Run crate tests
        id: test
        run: |
          echo "status=testing" >> $GITHUB_OUTPUT
          if cargo test -p ${{ steps.crate.outputs.target_crate }} --lib --bins 2>&1; then
            echo "status=test_success" >> $GITHUB_OUTPUT
            echo "test_result=passed" >> $GITHUB_OUTPUT
            echo "Tests ✅"
          else
            echo "status=test_failed" >> $GITHUB_OUTPUT
            echo "test_result=failed" >> $GITHUB_OUTPUT
            echo "Tests ❌"
          fi

      # Generate workflow summary
      - name: Generate workflow summary
        run: |
          BUILD_STATUS='${{ steps.build.outputs.status }}'
          TEST_RESULT='${{ steps.test.outputs.test_result }}'
          CRATE='${{ steps.crate.outputs.target_crate }}'

          if [ "$TEST_RESULT" = "passed" ]; then
            echo "## ✅ Code Gene Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Crate | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| \`$CRATE\` | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 All tests passed! Ready to merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Code Gene Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Crate | Result |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| \`$CRATE\` | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Tests failed. Merge blocked until tests pass." >> $GITHUB_STEP_SUMMARY
          fi

      # Post test results as PR comment
      - name: Post test results as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const crateName = '${{ steps.crate.outputs.target_crate }}';
            const buildStatus = '${{ steps.build.outputs.status }}';
            const testResult = '${{ steps.test.outputs.test_result }}';

            const buildIcon = buildStatus.includes('success') ? '✅' : '❌';
            const testIcon = testResult === 'passed' ? '✅' : '❌';

            const testComment = `
            ## 🧪 Code Gene Test Results

            **Crate:** \`${crateName}\`
            **Branch:** \`${context.payload.pull_request.head.ref}\`
            **Commit:** \`${context.sha.substring(0, 7)}\`

            | Step | Status |
            |------|--------|
            | Build | ${buildIcon} ${buildStatus} |
            | Tests | ${testIcon} ${testResult} |

            ${testResult === 'failed' ? '⚠️ **Merge blocked** - Tests must pass before merging' : '✅ Ready to merge'}

            ---
            _Automated test results from code-gene workflow_
            `;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: testComment
            });

      # Set commit status for branch protection
      - name: Set test status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const crateName = '${{ steps.crate.outputs.target_crate }}';
            const buildStatus = '${{ steps.build.outputs.status }}';
            const testResult = '${{ steps.test.outputs.test_result }}';

            const isSuccess = buildStatus.includes('success') && testResult === 'passed';

            // Set commit status for branch protection
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: isSuccess ? 'success' : 'failure',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions`,
              description: `Code Gene Test: ${isSuccess ? 'All tests passed' : 'Tests failed'}`,
              context: `code-gene/test/${crateName}`
            });

      # Send Slack notification (if webhook secret is configured)
      - name: Send Slack notification
        if: always() && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel: ${{ env.SLACK_CHANNEL || '#github' }}
          payload: |
            {
              "text": "${{ job.status == 'success' && steps.test.outputs.test_result == 'passed' && '✅' || '❌' }} Code Gene Test: ${{ steps.crate.outputs.target_crate }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ job.status == 'success' && steps.test.outputs.test_result == 'passed' && ':white_check_mark:' || ':x:' }} *Code Gene Test*\n*Crate:* \`${{ steps.crate.outputs.target_crate }}\`\n*PR:* #${{ steps.crate.outputs.pr_number }}\n*Result:* ${{ steps.test.outputs.test_result == 'passed' && 'Passed :white_check_mark:' || 'Failed :x:' }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
