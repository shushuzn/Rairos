<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <filter id="s" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="light" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" result="n" seed="9"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F0EAE0"/>
    </linearGradient>
  </defs>

  <!-- Paper background -->
  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Subtle ruled lines (notebook) -->
  <g stroke="#D4C5B0" stroke-width="0.6" opacity="0.5">
    <line x1="0" y1="75" x2="900" y2="75"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="145" x2="900" y2="145"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="215" x2="900" y2="215"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
  </g>

  <!-- Left margin rule -->
  <line x1="80" y1="0" x2="80" y2="300" stroke="#C4706A" stroke-width="1" opacity="0.25"/>

  <!-- ═══ LOGO MARK — Hexagon + R ═══ -->
  <g transform="translate(110, 55)" filter="url(#s)">
    <!-- Outer hexagon frame -->
    <polygon points="70,0 130,20 130,80 70,100 10,80 10,20"
      fill="#FAF6F0" stroke="#2C2416" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Inner hexagon accent -->
    <polygon points="70,16 118,32 118,72 70,88 22,72 22,32"
      fill="none" stroke="#D4C5B0" stroke-width="0.9" stroke-linejoin="round" opacity="0.7"/>
    <!-- R letterform — geometric -->
    <line x1="46" y1="30" x2="46" y2="72" stroke="#2C2416" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 46 38 Q 46 30, 54 30 L 72 30 Q 80 30, 80 38 Q 80 46, 72 46 L 54 46" fill="none" stroke="#2C2416" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 56 46 L 56 55 Q 56 64, 65 67 L 80 74" fill="none" stroke="#2C2416" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Gene dots -->
    <circle cx="46" cy="28" r="4" fill="#6B8FAD"/>
    <circle cx="80" cy="30" r="3.5" fill="#6B8FAD" opacity="0.8"/>
    <circle cx="80" cy="74" r="3.5" fill="#7A9E7A" opacity="0.8"/>
  </g>

  <!-- ═══ TYPOGRAPHY ═══ -->
  <g transform="translate(360, 0)" filter="url(#s)">
    <!-- "Rairos" -->
    <text x="0" y="148"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="108" font-weight="700"
      fill="#2C2416" letter-spacing="-1">Rairos</text>

    <!-- Tagline -->
    <text x="4" y="190"
      font-family="Georgia, serif"
      font-size="19" fill="#6B5E4A" font-style="italic">Self-Evolving Research Operating System</text>

    <!-- Decorative rule -->
    <line x1="2" y1="210" x2="480" y2="210" stroke="#D4C5B0" stroke-width="1.2" opacity="0.8" filter="url(#light)"/>
  </g>

  <!-- Bottom label -->
  <text x="450" y="270"
    font-family="Georgia, serif" font-size="12"
    fill="#A89E8C" text-anchor="middle" letter-spacing="1.5"
    filter="url(#light)">Gene Pool · Insight Evolution · Research OS</text>

  <!-- Corner marks (precision) -->
  <g stroke="#D4C5B0" stroke-width="1" opacity="0.4" filter="url(#light)">
    <path d="M 24 24 L 24 36 M 24 24 L 36 24"/>
    <path d="M 876 24 L 876 36 M 876 24 L 864 24"/>
    <path d="M 24 276 L 24 264 M 24 276 L 36 276"/>
    <path d="M 876 276 L 876 264 M 876 276 L 864 276"/>
  </g>
</svg>
