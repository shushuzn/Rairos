<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citation Graph - Rairos</title>
  <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; overflow: hidden; }
    #graph { width: 100vw; height: 100vh; }
    .node { cursor: pointer; }
    .node circle { stroke: #fff; stroke-width: 1.5px; }
    .node text { font-size: 10px; fill: #e6edf3; pointer-events: none; }
    .link { stroke: #30363d; stroke-opacity: 0.6; }
    .link.cites { stroke: #58a6ff; }
    .link.cited_by { stroke: #f78166; }
    #info { position: fixed; top: 20px; right: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; width: 280px; max-height: 80vh; overflow-y: auto; }
    #info h3 { font-size: 14px; margin-bottom: 8px; color: #58a6ff; }
    #info p { font-size: 12px; color: #8b949e; margin: 4px 0; }
    #info .meta { color: #8b949e; font-size: 11px; }
    #controls { position: fixed; bottom: 20px; left: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; }
    #controls label { font-size: 12px; color: #8b949e; margin-right: 8px; }
    #controls select, #controls button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    #controls button:hover { background: #30363d; }
    #legend { position: fixed; bottom: 20px; right: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-size: 11px; }
    #legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: #58a6ff; }
  </style>
</head>
<body>
  <div id="graph"></div>
  <div id="info"><h3>Citation Graph</h3><p>Click a node to see details</p></div>
  <div id="controls">
    <label>Depth:</label>
    <select id="depthSelect"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select>
    <button onclick="loadGraph()">Reload</button>
  </div>
  <div id="legend">
    <div><span class="dot" style="background:#4A90E2"></span>Root paper</div>
    <div><span class="dot" style="background:#58a6ff"></span>Cites (forward)</div>
    <div><span class="dot" style="background:#f78166"></span>Cited by (backward)</div>
    <div><span class="dot" style="background:#7ee787"></span>2-hop papers</div>
  </div>
  <div id="loading" class="loading">Loading citation graph...</div>

  <script>
    let nodes = [], links = [], simulation, svg, g;
    const color = { root: '#4A90E2', cites: '#58a6ff', cited_by: '#f78166', distant: '#7ee787', paper: '#8b949e' };

    function loadGraph(paperId, depth) {
      const pid = paperId || new URLSearchParams(location.search).get('paper') || '2307.02486';
      const d = depth || document.getElementById('depthSelect').value;
      document.getElementById('loading').style.display = 'block';
      fetch('/api/citation-graph/' + encodeURIComponent(pid) + '?depth=' + d)
        .then(r => r.json())
        .then(data => {
          nodes = data.nodes || [];
          links = data.links || [];
          document.title = 'Citation Graph - ' + (data.root || pid);
          render();
          document.getElementById('loading').style.display = 'none';
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loading').textContent = 'Failed to load: ' + err.message;
        });
    }

    function render() {
      d3.select('#graph').selectAll('*').remove();
      const w = window.innerWidth, h = window.innerHeight;
      svg = d3.select('#graph').append('svg').attr('width', w).attr('height', h);
      g = svg.append('g');

      svg.call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => g.attr('transform', e.transform)));

      simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(80))
        .force('charge', d3.forceManyBody().strength(-200))
        .force('center', d3.forceCenter(w / 2, h / 2))
        .force('collision', d3.forceCollide().radius(30));

      const link = g.append('g').selectAll('line').data(links).join('line')
        .attr('class', d => 'link ' + d.relation)
        .attr('stroke', d => d.relation === 'cites' ? color.cites : color.cited_by)
        .attr('stroke-width', d => Math.sqrt(d.weight || 1));

      const node = g.append('g').selectAll('g').data(nodes).join('g')
        .attr('class', 'node')
        .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended))
        .on('click', (e, d) => showInfo(d));

      node.append('circle')
        .attr('r', d => d.is_root ? 12 : 8)
        .attr('fill', d => d.is_root ? color.root : d.is_citing ? color.cites : d.is_cited_by ? color.cited_by : color.distant);

      node.append('text')
        .attr('dx', 14).attr('dy', 4)
        .text(d => (d.label || d.id || '').substring(0, 30));

      simulation.on('tick', () => {
        link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
      });
    }

    function showInfo(d) {
      const info = document.getElementById('info');
      const h = ['<h3>' + (d.label || d.id) + '</h3>'];
      h.push('<p class="meta">ID: ' + (d.entity_id || d.id) + '</p>');
      if (d.is_root) h.push('<p style="color:#4A90E2">★ Root paper</p>');
      if (d.is_citing) h.push('<p style="color:#58a6ff">→ Cites root</p>');
      if (d.is_cited_by) h.push('<p style="color:#f78166">← Cited by root</p>');
      h.push('<p class="meta">Type: ' + (d.type || 'Paper') + '</p>');
      info.innerHTML = h.join('');
    }

    function dragstarted(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
    function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragended(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

    const params = new URLSearchParams(location.search);
    if (params.has('paper')) loadGraph();
    else loadGraph('2307.02486', 2);
  </script>
</body>
</html>
