<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Subtle sketch for hand-drawn quality -->
    <filter id="s" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="n" seed="5"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Hexagonal frame — AI/research system identity -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    fill="#FAF6F0"
    stroke="#2C2416"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#s)"
  />

  <!-- Inner hexagonal subtle line -->
  <polygon
    points="32,10 50,21 50,43 32,54 14,43 14,21"
    fill="none"
    stroke="#D4C5B0"
    stroke-width="0.8"
    stroke-linejoin="round"
    opacity="0.7"
    filter="url(#s)"
  />

  <!-- Clean R letterform — geometric but warm -->
  <!-- Vertical stroke -->
  <line x1="22" y1="20" x2="22" y2="44" stroke="#2C2416" stroke-width="3.5" stroke-linecap="round" filter="url(#s)"/>

  <!-- R bowl -->
  <path d="M 22 26 Q 22 22, 26 22 L 34 22 Q 38 22, 38 26 Q 38 30, 34 30 L 26 30" fill="none" stroke="#2C2416" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#s)"/>

  <!-- R leg -->
  <path d="M 28 30 L 28 34 Q 28 38, 32 40 L 38 44" fill="none" stroke="#2C2416" stroke-width="2.8" stroke-linecap="round" filter="url(#s)"/>

  <!-- Accent dot — gene/research node in brand color -->
  <circle cx="22" cy="20" r="2.5" fill="#6B8FAD" filter="url(#s)"/>
  <circle cx="38" cy="22" r="2" fill="#6B8FAD" opacity="0.7" filter="url(#s)"/>
  <circle cx="38" cy="44" r="2" fill="#7A9E7A" opacity="0.7" filter="url(#s)"/>
</svg>
