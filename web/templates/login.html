<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rairos</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    body { background: #faf8f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Georgia, serif; }
    .login-box { background: white; border: 1px solid #e0dbd4; border-radius: 8px; padding: 36px 40px; width: 320px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .login-title { font-family: 'Caveat', cursive; font-size: 28px; font-weight: 700; color: #2a4a6a; margin: 0 0 6px; }
    .login-sub { font-size: 13px; color: #A89E8C; margin: 0 0 24px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #7a7570; margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; font-family: Georgia, serif; }
    input:focus { outline: none; border-color: #6B8FB5; }
    .btn { width: 100%; padding: 9px; background: #6B8FB5; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: #5a7fa5; }
    .error { color: #C4706A; font-size: 12px; margin-top: 10px; text-align: center; }
    .setup-note { font-size: 11px; color: #A89E8C; text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-title">Rairos</div>
    <p class="login-sub">Sign in to access your research workspace</p>
    <form method="POST" action="/auth/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign In</button>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </form>
</body>
</html>
