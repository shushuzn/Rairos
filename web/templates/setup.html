<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Admin — Rairos</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    body { background: #faf8f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: Georgia, serif; }
    .setup-box { background: white; border: 1px solid #e0dbd4; border-radius: 8px; padding: 36px 40px; width: 340px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .setup-title { font-family: 'Caveat', cursive; font-size: 28px; font-weight: 700; color: #2a4a6a; margin: 0 0 6px; }
    .setup-sub { font-size: 13px; color: #A89E8C; margin: 0 0 24px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #7a7570; margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; font-family: Georgia, serif; }
    input:focus { outline: none; border-color: #6B8FB5; }
    .btn { width: 100%; padding: 9px; background: #6B8FB5; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: #5a7fa5; }
    .info { font-size: 11px; color: #A89E8C; margin-top: 14px; line-height: 1.5; }
    .error { color: #C4706A; font-size: 12px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="setup-box">
    <div class="setup-title">Rairos</div>
    <p class="setup-sub">Set up your admin account to secure your workspace</p>
    <form method="POST" action="/auth/setup">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required autocomplete="username" minlength="3">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="new-password" minlength="8">
      </div>
      <div class="form-group">
        <label for="password2">Confirm Password</label>
        <input id="password2" type="password" name="password2" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn">Create Account</button>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </form>
    <div class="info">
      <b>Note:</b> This account controls access to the web UI. Choose a strong password.<br>
      Leave blank to keep the UI open (single-user mode).
    </div>
  </div>
</body>
</html>
